name: Build verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - develop

# The job only reads the repository. Without this, GITHUB_TOKEN gets the repository's default permissions, which may
# include write access.
permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.2
          # From gitleaks_8.24.2_checksums.txt on the release page. Update it together with the version.
          GITLEAKS_SHA256: fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C /usr/local/bin gitleaks

      - name: Lint
        run: ./scripts/cicd/lint.sh

      - name: Scan (program)
        run: ./scripts/cicd/scan.sh

      - name: Build and test
        run: ./scripts/cicd/build.sh
