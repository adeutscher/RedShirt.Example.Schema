name: Build verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - develop

# The job only reads the repository. Without this, GITHUB_TOKEN gets the repository's default permissions, which may
# include write access.
permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config, where code from the branch under test could read it.
          persist-credentials: false

      # check-scripts.sh compares update scripts against a base: the target branch for a pull request, or the commit the
      # branch pointed at before the push. Fetch it here, before any code from the branch runs, with the token given to
      # this one command only, so that this also works for private repositories.
      - name: Fetch base for script checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          fetch() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              fetch --quiet --no-tags --depth=1 origin "$@"
          }
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            fetch "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
          elif [[ "${PUSH_BEFORE}" =~ ^0+$ ]]; then
            # A newly created branch has no previous commit, so there is nothing to compare against.
            echo "New branch, no previous commit to compare update scripts against."
            echo "BASE_REF=HEAD" >> "${GITHUB_ENV}"
          else
            fetch "+${PUSH_BEFORE}:refs/ci/push-before"
            echo "BASE_REF=refs/ci/push-before" >> "${GITHUB_ENV}"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.2
          # From gitleaks_8.24.2_checksums.txt on the release page. Update it together with the version.
          GITLEAKS_SHA256: fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C /usr/local/bin gitleaks

      - name: Lint
        run: ./scripts/cicd/lint.sh

      - name: Scan (program)
        run: ./scripts/cicd/scan.sh

      - name: Build and test
        run: ./scripts/cicd/build.sh
